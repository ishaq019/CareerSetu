services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: careersetu
      POSTGRES_USER: careersetu
      POSTGRES_PASSWORD: careersetu
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careersetu -d careersetu"]
      interval: 5s
      timeout: 5s
      retries: 10
  chroma:
    image: chromadb/chroma:latest
    ports: ["8001:8000"]
    volumes: [chroma_data:/data]
volumes:
  postgres_data:
  chroma_data:
